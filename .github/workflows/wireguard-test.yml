name: WireGuard Test

on:
  workflow_dispatch:

jobs:
  wireguard:
    runs-on: ubuntu-latest

    steps:
      - name: Install WireGuard
        run: |
          set -e

          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard iproute2

      - name: Create WireGuard test interface
        run: |
          set -e

          sudo modprobe wireguard

          PRIVATE_KEY=$(wg genkey)
          PUBLIC_KEY=$(printf '%s' "$PRIVATE_KEY" | wg pubkey)

          echo "Public key: $PUBLIC_KEY"

          KEY_FILE=$(mktemp)
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          sudo ip link add wg0 type wireguard
          sudo ip address add 10.99.0.1/24 dev wg0

          sudo wg set wg0 \
            private-key "$KEY_FILE" \
            listen-port 51820

          sudo ip link set wg0 up

          rm -f "$KEY_FILE"

          echo
          echo "===== WireGuard ====="
          sudo wg show

          echo
          echo "===== Interface ====="
          ip addr show wg0

          echo
          echo "===== WireGuard test ====="
          sudo wg show wg0

          echo
          echo "WIREGUARD_INTERFACE_OK"

      - name: Cleanup
        if: always()
        run: |
          sudo ip link delete wg0 2>/dev/null || true
