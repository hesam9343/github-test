name: GitHub Network Test

on:
  workflow_dispatch:

jobs:
  network-test:
    runs-on: ubuntu-latest

    steps:
      - name: System information
        run: |
          echo "========================================"
          echo "SYSTEM INFORMATION"
          echo "========================================"
          uname -a
          echo
          lsb_release -a 2>/dev/null || cat /etc/os-release
          echo
          echo "CPU:"
          nproc
          echo
          echo "----------------------------------------"

      - name: Public IPv4
        run: |
          echo "========================================"
          echo "PUBLIC IPv4"
          echo "========================================"

          IP=$(curl -4 -s --max-time 10 https://api.ipify.org)

          echo "IPv4: $IP"
          echo

          echo "IP information:"
          curl -4 -s --max-time 10 "https://ipinfo.io/$IP/json" || true

          echo
          echo "----------------------------------------"

      - name: Public IPv6
        run: |
          echo "========================================"
          echo "PUBLIC IPv6"
          echo "========================================"

          curl -6 -s --max-time 10 https://api6.ipify.org || echo "No IPv6"
          echo
          echo "----------------------------------------"

      - name: Network location
        run: |
          echo "========================================"
          echo "NETWORK LOCATION"
          echo "========================================"

          echo "ipinfo.io:"
          curl -4 -s --max-time 10 https://ipinfo.io/json || true

          echo
          echo
          echo "ip-api.com:"
          curl -4 -s --max-time 10 \
            "http://ip-api.com/json/?fields=status,message,country,countryCode,regionName,city,isp,org,as,query" || true

          echo
          echo "----------------------------------------"

      - name: DNS test
        run: |
          echo "========================================"
          echo "DNS TEST"
          echo "========================================"

          echo "Google DNS:"
          time nslookup google.com 8.8.8.8 || true

          echo
          echo "Cloudflare DNS:"
          time nslookup google.com 1.1.1.1 || true

          echo
          echo "----------------------------------------"

      - name: Ping test
        run: |
          echo "========================================"
          echo "PING TEST"
          echo "========================================"

          echo
          echo "Cloudflare 1.1.1.1"
          ping -c 10 -W 3 1.1.1.1 || true

          echo
          echo "Google 8.8.8.8"
          ping -c 10 -W 3 8.8.8.8 || true

          echo
          echo "Google DNS 8.8.4.4"
          ping -c 10 -W 3 8.8.4.4 || true

          echo
          echo "----------------------------------------"

      - name: TCP latency test
        run: |
          echo "========================================"
          echo "TCP LATENCY TEST"
          echo "========================================"

          echo
          echo "Cloudflare HTTPS:"
          curl -4 -o /dev/null -s \
            -w "DNS: %{time_namelookup}s | Connect: %{time_connect}s | TLS: %{time_appconnect}s | Total: %{time_total}s\n" \
            https://1.1.1.1/

          echo
          echo "Google HTTPS:"
          curl -4 -o /dev/null -s \
            -w "DNS: %{time_namelookup}s | Connect: %{time_connect}s | TLS: %{time_appconnect}s | Total: %{time_total}s\n" \
            https://www.google.com/

          echo
          echo "----------------------------------------"

      - name: Install traceroute
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y traceroute mtr-tiny -qq

      - name: Traceroute Cloudflare
        run: |
          echo "========================================"
          echo "TRACEROUTE TO CLOUDFLARE"
          echo "========================================"

          traceroute -4 -n -w 2 -q 1 -m 20 1.1.1.1 || true

          echo
          echo "----------------------------------------"

      - name: Traceroute Google
        run: |
          echo "========================================"
          echo "TRACEROUTE TO GOOGLE"
          echo "========================================"

          traceroute -4 -n -w 2 -q 1 -m 20 8.8.8.8 || true

          echo
          echo "----------------------------------------"

      - name: MTR test
        run: |
          echo "========================================"
          echo "MTR TEST"
          echo "========================================"

          mtr -4 -r -c 20 -w 1.1.1.1 || true

          echo
          echo "----------------------------------------"

      - name: Download speed test
        run: |
          echo "========================================"
          echo "DOWNLOAD TEST"
          echo "========================================"

          echo "Downloading 10 MB test file..."

          curl -L \
            --max-time 60 \
            -o /dev/null \
            -s \
            -w "Downloaded: %{size_download} bytes\nSpeed: %{speed_download} bytes/sec\nTime: %{time_total} sec\n" \
            https://speed.hetzner.de/10MB.bin || true

          echo
          echo "----------------------------------------"

      - name: Final summary
        run: |
          echo "========================================"
          echo "TEST FINISHED"
          echo "========================================"
          echo
          echo "IMPORTANT:"
          echo "GitHub-hosted runner IPs are temporary."
          echo "This workflow is only a network diagnostic test."
          echo
          echo "Send the complete Actions log for analysis."


      - name: Europe TCP Latency Test
        run: |
          echo "========================================"
          echo "EUROPE TCP LATENCY TEST"
          echo "========================================"

          test_tcp() {
            NAME="$1"
            URL="$2"

            echo ""
            echo "$NAME"
            curl -4 -o /dev/null -sS \
              --connect-timeout 10 \
              --max-time 15 \
              -w "HTTP: %{http_code} | DNS: %{time_namelookup}s | Connect: %{time_connect}s | TLS: %{time_appconnect}s | Total: %{time_total}s\n" \
              "$URL" || echo "Connection failed"
          }

          test_tcp "Frankfurt - Cloudflare" "https://www.cloudflare.com/"
          test_tcp "Amsterdam - Cloudflare" "https://www.cloudflare.com/"
          test_tcp "Paris - OVH" "https://www.ovhcloud.com/"
          test_tcp "London - OVH" "https://www.ovhcloud.com/"

      - name: Europe Network Quality Test
        run: |
          echo "========================================"
          echo "EUROPE NETWORK QUALITY TEST"
          echo "========================================"

          test_host() {
            NAME="$1"
            HOST="$2"

            echo ""
            echo "[$NAME]"
            echo "Host: $HOST"

            for i in 1 2 3 4 5; do
              RESULT=$(curl -4 -o /dev/null -sS \
                --connect-timeout 10 \
                --max-time 15 \
                -w "%{time_connect} %{time_appconnect} %{time_total}" \
                "https://$HOST/" 2>/dev/null || echo "FAILED")

              echo "Test $i: $RESULT"
            done
          }

          test_host "London" "london.speedtest.leaseweb.net"
          test_host "Paris" "speedtest.paris01.ovh.net"
          test_host "Frankfurt" "fra.speedtest.leaseweb.net"
          test_host "Amsterdam" "ams.speedtest.leaseweb.net"


      - name: Europe iPerf3 Network Test
        run: |
          echo "========================================"
          echo "EUROPE IPERF3 NETWORK TEST"
          echo "========================================"

          if ! command -v iperf3 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq iperf3
          fi

          test_server() {
            NAME="$1"
            HOST="$2"

            echo ""
            echo "========================================"
            echo "$NAME"
            echo "Host: $HOST"
            echo "========================================"

            echo "--- TCP ---"
            iperf3 -c "$HOST" -p 5201 -t 5 -J 2>/dev/null \
              | python3 -c '
          import sys,json
          try:
              d=json.load(sys.stdin)
              s=d["end"]["streams"][0]["sender"]
              print("Retransmits:", s.get("retransmits"))
              print("RTT avg:", s.get("rtt"))
              print("TCP Mbps:", round(s.get("bits_per_second",0)/1e6,2))
          except:
              print("TCP test failed")
          '

            echo "--- UDP ---"
            iperf3 -c "$HOST" -p 5201 -u -b 10M -t 5 -J 2>/dev/null \
              | python3 -c '
          import sys,json
          try:
              d=json.load(sys.stdin)
              s=d["end"]["streams"][0]["udp"]
              print("Jitter:", s.get("jitter_ms"), "ms")
              print("Lost:", s.get("lost_percent"), "%")
              print("UDP Mbps:", round(s.get("bits_per_second",0)/1e6,2))
          except:
              print("UDP test failed")
          '
          }

          test_server "London LON-01" "speedtest.lon1.uk.leaseweb.net"
          test_server "London LON-12" "speedtest.lon12.uk.leaseweb.net"
          test_server "Frankfurt FRA-01" "speedtest.fra1.de.leaseweb.net"
          test_server "Amsterdam AMS-01" "speedtest.ams1.nl.leaseweb.net"
          test_server "Amsterdam AMS-02" "speedtest.ams2.nl.leaseweb.net"
